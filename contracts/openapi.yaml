openapi: 3.1.0
info:
  title: 이상거래 — 공통 API 계약
  version: 0.1.0
  description: Draft v2.1 기반 제안 계약. PUBLIC은 Backend API이며 INTERNAL은 모듈 경계입니다. 실제 거래 전송은 지원하지 않습니다. 공개 배포와 인증 정책은
    별도 합의가 필요합니다.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
- name: PUBLIC
  description: Frontend가 호출하는 Backend 전용 API
- name: INTERNAL
  description: Backend와 내부 모듈 간 계약. 브라우저에 노출하지 않습니다.
paths:
  /api/v1/analyses:
    post:
      operationId: createAnalysis
      tags:
      - PUBLIC
      x-audience: PUBLIC
      summary: createAnalysis
      responses:
        '202':
          description: 성공
          content:
            application/json:
              schema:
                $ref: schemas/api.schema.json#/$defs/AnalysisAccepted
              examples:
                synthetic:
                  summary: 합성 데이터 예시
                  externalValue: fixtures/api/accepted.json
          headers:
            Location:
              description: 분석 작업 조회 URL
              schema:
                type: string
                format: uri-reference
        '400':
          description: 잘못된 요청 또는 계약 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 참조/버전/상태 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 지원하지 않는 계약 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 요청 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 상위 데이터 제공자 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 일시적 서비스 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schemas/api.schema.json#/$defs/AnalysisRequest
            examples:
              synthetic:
                summary: 합성 데이터 예시
                externalValue: fixtures/normal/collection-request.json
